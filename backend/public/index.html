<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Avezzano Plus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    #registerOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #registerBox {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 350px;
      text-align: center;
    }

    #registerBox input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
    }

    #app {
      display: none;
      height: 100vh;
    }

    #sidebar {
      width: 30%;
      max-width: 260px;
      background: #fff;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }

    #chatList div {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    #chatList div:hover {
      background: #f0f0f0;
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .msg {
      margin-bottom: 8px;
    }

    .me {
      font-weight: bold;
    }

    #inputBox {
      display: flex;
      border-top: 1px solid #ccc;
    }

    #inputBox input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    #inputBox button {
      padding: 10px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      #sidebar {
        width: 40%;
      }
    }
  </style>
</head>
<body>

<!-- REGISTRAZIONE -->
<div id="registerOverlay">
  <div id="registerBox">
    <h3>Registrazione</h3>
    <input id="nameInput" placeholder="Nome" />
    <input id="photoInput" placeholder="URL foto (opzionale)" />
    <button onclick="register()">Entra</button>
  </div>
</div>

<div id="app" style="display:flex;">
  <div id="sidebar">
    <div id="chatList"></div>
  </div>

  <div id="main">
    <div id="messages"></div>
    <div id="inputBox">
      <input id="msgInput" placeholder="Scrivi..." />
      <button onclick="sendMessage()">Invia</button>
    </div>
  </div>
</div>

<script>
let ws;
let userData = null;
let currentChat = "public";
let chats = { public: [] };

function register() {
  const name = nameInput.value.trim();
  if (!name) return alert("Inserisci un nome");

  userData = {
    name,
    photo: photoInput.value.trim()
  };

  localStorage.setItem("userData", JSON.stringify(userData));
  startApp();
}

function startApp() {
  document.getElementById("registerOverlay").style.display = "none";
  document.getElementById("app").style.display = "flex";

  ws = new WebSocket("ws://" + location.host);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "join", user: userData }));
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.type === "users") {
      updateChats(data.users);
    }

    if (data.type === "message") {
      handleMessage(data);
    }
  };

  renderChatList();
}

function updateChats(users) {
  users.forEach(u => {
    if (u !== userData.name && !chats[u]) {
      chats[u] = [];
    }
  });
  renderChatList();
}

function handleMessage({ from, to, text }) {
  if (from === userData.name && to === userData.name) return;

  const chat =
    to === "public" ? "public" :
    from === userData.name ? to :
    from;

  if (chat === userData.name) return;

  if (!chats[chat]) chats[chat] = [];
  chats[chat].push({ from, text });

  if (currentChat === chat) renderMessages();
}

function renderChatList() {
  chatList.innerHTML = "";
  Object.keys(chats).forEach(c => {
    if (c === userData?.name) return;

    const d = document.createElement("div");
    d.textContent = c === "public" ? "Chat pubblica" : c;
    d.onclick = () => {
      currentChat = c;
      renderMessages();
    };
    chatList.appendChild(d);
  });
}

function renderMessages() {
  messages.innerHTML = "";
  (chats[currentChat] || []).forEach(m => {
    const d = document.createElement("div");
    d.className = "msg";
    d.innerHTML = `<span class="${m.from === userData.name ? "me" : ""}">${m.from}:</span> ${m.text}`;
    messages.appendChild(d);
  });
}

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;

  ws.send(JSON.stringify({
    type: "message",
    from: userData.name,
    to: currentChat,
    text
  }));

  msgInput.value = "";
}

const saved = localStorage.getItem("userData");
if (saved) {
  userData = JSON.parse(saved);
  startApp();
}
</script>
</body>
</html>
